# 未服用アラートを15分ごとに確認して送信する(Firebase の Blaze プランは不要)
name: overdue-alerts

on:
  schedule:
    # 5分ごと(毎時2分から)。GitHub は混雑時に定期実行を飛ばすため、回数を増やして間隔のばらつきを抑える。
    # 0分・15分など区切りのよい時刻は特に混むので避けている。
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      test_push:
        description: 'テスト通知を全メンバーに送る(動作確認用)'
        type: boolean
        default: false

# 実行が重ならないようにする(同じアラートの二重送信防止)
concurrency:
  group: overdue-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install
        run: npm install --omit=dev
        working-directory: alert-worker
      - name: send alerts
        run: node run.js
        working-directory: alert-worker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_PUSH: ${{ inputs.test_push }}
