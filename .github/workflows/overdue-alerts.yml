# 未服用アラートを15分ごとに確認して送信する(Firebase の Blaze プランは不要)
name: overdue-alerts

on:
  schedule:
    # 毎時0・15・30・45分は GitHub が混み合って実行が飛ばされやすいため、少しずらしている
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch: {}

# 実行が重ならないようにする(同じアラートの二重送信防止)
concurrency:
  group: overdue-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install
        run: npm install --omit=dev
        working-directory: alert-worker
      - name: send alerts
        run: node run.js
        working-directory: alert-worker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
